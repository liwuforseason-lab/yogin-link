name: 핫딜 수집

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hotdeals
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 공개 핫딜 모으기
        run: node scripts/collect-hotdeals.mjs

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name "yogin-hotdeals-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- src/data/hotdeals.json; then
            echo "변경 없음"
            exit 0
          fi
          git add src/data/hotdeals.json
          git commit -m "핫딜 갱신: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
