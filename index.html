<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7e2d8" />
<title>요긴상회 · 생활꿀템 번호 검색</title>
<meta name="description" content="요긴상회가 직접 골라 쓴 생활꿀템을 번호로 찾아 쿠팡 최저가로 바로 이동하세요. 001, 002 번호 또는 상품명 검색." />
<meta property="og:title" content="요긴상회 · 생활꿀템 번호 검색" />
<meta property="og:description" content="영상에서 본 번호(예: 002)를 검색하면 쿠팡 최저가 링크로 바로 연결돼요." />
<meta property="og:type" content="website" />
<link rel="stylesheet" href="assets/style.css?v=20261119b" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23e8827e'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' fill='%23fff8f2' font-family='sans-serif'%3E%EC%9A%94%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="page">

    <header class="hero">
      <div class="brand">
        <div class="brand__mark" aria-hidden="true">요</div>
        <div class="brand__text">
          <h1 id="shopName">요긴상회</h1>
          <p id="shopTagline">생활꿀템 번호 검색</p>
        </div>
      </div>
      <p class="hero__lead">영상·게시물에서 본 <b>번호</b>를 그대로 검색하면<br />쿠팡 최저가 링크로 바로 이동해요.</p>
      <div class="hero__chips" id="heroChips" aria-label="번호 바로가기"></div>
    </header>

    <div class="searchbar" id="searchbar">
      <div class="searchbar__inner">
        <svg class="searchbar__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M16.5 16.5 21 21" /></svg>
        <input
          id="q"
          type="search"
          inputmode="search"
          autocomplete="off"
          enterkeyhint="search"
          placeholder="번호·상품명 검색  예) 002, 세타필"
          aria-label="상품 번호 또는 이름 검색"
        />
        <button id="clearBtn" class="searchbar__clear" type="button" aria-label="검색어 지우기" hidden>✕</button>
      </div>
      <p class="searchbar__hint" id="resultCount"></p>
    </div>

    <main id="list" class="list" aria-live="polite"></main>

    <div id="empty" class="empty" hidden>
      <div class="empty__emoji">🔍</div>
      <p class="empty__title">아직 그 번호의 상품이 없어요</p>
      <p class="empty__sub">번호는 <b>001</b>부터 차례로 올라가요.<br />상품명 일부(예: 세타필)로도 찾을 수 있어요.</p>
      <button type="button" class="empty__reset" id="resetBtn">전체 상품 보기</button>
    </div>

    <footer class="footer">
      <p class="footer__notice">
        이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.
      </p>
      <p class="footer__meta">
        <span id="footerHandle">@zipora_find</span> · <span id="footerUpdated"></span>
      </p>
      <p class="footer__small">
        표시 가격은 확인 시점 기준이며, 쿠팡 판매가·할인율은 실시간으로 달라질 수 있어요. 최종 가격은 쿠팡 상품 페이지에서 확인해 주세요.
      </p>
    </footer>

  </div>

  <script src="assets/app.js?v=20261119b"></script>
</body>
</html>
